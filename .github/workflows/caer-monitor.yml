name: CAER Monitor

on:
  schedule:
    - cron: "*/29 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          CAER_USER_AGENT: "CAER-Monitor/1.0 (+https://github.com/${{ github.repository }})"
        run: python -m scraper.scraper

      - name: Run tests
        run: pytest -q

      - name: Check for data changes
        id: diff
        run: |
          git diff --quiet -- data || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/caer_messages.json data/caer_messages.txt data/metadata.csv
          git commit -m "Update CAER archive data"
          git push
