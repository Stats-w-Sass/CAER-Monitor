name: CAER Monitor

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0,29 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run scraper
        env:
          CAER_USER_AGENT: "CAER-Monitor/1.0 (+https://github.com/${{ github.repository }})"
        run: python -m scraper.scraper

      - name: Run tests
        run: pytest -q

      - name: Collect diagnostic info and upload artifact
        run: |
          mkdir -p diagnostic
          echo "=== python info ===" > diagnostic/info.txt
          python -V >> diagnostic/info.txt 2>&1 || true
          python -m pip --version >> diagnostic/info.txt 2>&1 || true
          python -m pip list --format=columns >> diagnostic/info.txt 2>&1 || true
          echo "=== workspace listing ===" >> diagnostic/info.txt
          ls -la >> diagnostic/info.txt 2>&1 || true
          echo "=== data dir ===" >> diagnostic/info.txt
          ls -la data >> diagnostic/info.txt 2>&1 || true
        uses: actions/upload-artifact@v4
        with:
          name: caer-diagnostics
          path: diagnostic/info.txt

      - name: Check for data changes
        id: diff
        run: |
          git diff --quiet -- data || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/caer_messages.json data/caer_messages.txt data/metadata.csv
          git commit -m "Update CAER archive data"
          git push
